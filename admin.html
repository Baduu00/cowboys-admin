<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menü Yönetimi — Cowboy's Admin</title>
<style>
  :root{--charcoal:#1C1512;--charcoal-2:#2A1F1A;--cream:#F4EBDA;--rope:#C9962F;--redwood:#8C3423;}
  *{box-sizing:border-box;}
  body{background:var(--charcoal);color:var(--cream);font-family:sans-serif;margin:0;padding:30px;}
  .wrap{max-width:900px;margin:0 auto;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  h1{font-size:1.5rem;}
  a.logout{color:var(--redwood);text-decoration:none;font-size:0.9rem;}
  table{width:100%;border-collapse:collapse;background:var(--charcoal-2);border-radius:6px;overflow:hidden;margin-bottom:30px;}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(244,235,218,0.1);font-size:0.9rem;}
  th{background:rgba(201,150,47,0.15);color:var(--rope);}
  input{width:100%;padding:6px 8px;border-radius:4px;border:1px solid #444;background:#1a130f;color:var(--cream);font-size:0.85rem;}
  .actions{display:flex;gap:6px;}
  button{padding:7px 12px;border:none;border-radius:4px;cursor:pointer;font-size:0.82rem;font-weight:600;}
  .save-btn{background:var(--rope);color:var(--charcoal);}
  .save-btn:hover{background:#e0ac3f;}
  .del-btn{background:var(--redwood);color:var(--cream);}
  .del-btn:hover{background:#a53f2e;}
  .add-box{background:var(--charcoal-2);padding:20px;border-radius:6px;border-top:3px solid var(--rope);}
  .add-box h2{font-size:1.1rem;margin-bottom:14px;}
  .add-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:10px;align-items:end;}
  .add-grid label{display:block;font-size:0.75rem;color:#c9bba3;margin-bottom:4px;}
  .add-btn{background:var(--rope);color:var(--charcoal);padding:10px;font-weight:700;}
  .api-note{margin-top:26px;font-size:0.8rem;color:#c9bba3;background:rgba(201,150,47,0.08);padding:12px 16px;border-radius:4px;}
  .api-note code{color:var(--rope);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🤠 Menü Yönetimi</h1>
    <a class="logout" href="{{ url_for('logout') }}">Çıkış Yap</a>
  </header>

  <table>
    <thead>
      <tr><th>Ürün</th><th>100gr</th><th>140gr</th><th>200gr</th><th>Kategori</th><th>Sıra</th><th>İşlem</th></tr>
    </thead>
    <tbody>
      {% for item in items %}
      <form method="POST" action="{{ url_for('admin_update', item_id=item['id']) }}">
        <tr>
          <td><input name="name" value="{{ item['name'] }}"></td>
          <td><input name="price_100g" value="{{ item['price_100g'] or '' }}"></td>
          <td><input name="price_140g" value="{{ item['price_140g'] or '' }}"></td>
          <td><input name="price_200g" value="{{ item['price_200g'] or '' }}"></td>
          <td><input name="category" value="{{ item['category'] }}"></td>
          <td><input name="sort_order" value="{{ item['sort_order'] }}" style="width:50px;"></td>
          <td class="actions">
            <button class="save-btn" type="submit">Kaydet</button>
          </td>
        </tr>
      </form>
      <form method="POST" action="{{ url_for('admin_delete', item_id=item['id']) }}" style="display:contents;">
        <tr><td colspan="7" style="text-align:right;padding:2px 12px 10px;">
          <button class="del-btn" type="submit" onclick="return confirm('Silinsin mi?')">Sil</button>
        </td></tr>
      </form>
      {% endfor %}
    </tbody>
  </table>

  <div class="add-box">
    <h2>Yeni Ürün Ekle</h2>
    <form method="POST" action="{{ url_for('admin_add') }}">
      <div class="add-grid">
        <div><label>Ürün Adı</label><input name="name" required></div>
        <div><label>100gr</label><input name="price_100g"></div>
        <div><label>140gr</label><input name="price_140g"></div>
        <div><label>200gr</label><input name="price_200g"></div>
        <div><label>Kategori</label><input name="category" value="burger"></div>
        <button class="add-btn" type="submit">Ekle</button>
      </div>
    </form>
  </div>

  <div class="api-note">
    Menü verisi otomatik olarak <code>/api/menu</code> adresinden JSON olarak yayınlanır. Statik sitedeki menü bölümü bu adrese bağlanarak güncel fiyatları gösterir.
  </div>
</div>
</body>
</html>
