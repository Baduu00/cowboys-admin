<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Giriş — Cowboy's Admin</title>
<style>
  body{background:#1C1512;color:#F4EBDA;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
  .box{background:#2A1F1A;padding:40px;border-radius:8px;border-top:4px solid #C9962F;width:300px;}
  h1{font-size:1.3rem;margin-bottom:20px;text-align:center;}
  input{width:100%;padding:10px;margin-bottom:14px;border-radius:4px;border:none;box-sizing:border-box;}
  button{width:100%;padding:12px;background:#C9962F;border:none;border-radius:4px;font-weight:bold;cursor:pointer;}
  button:hover{background:#e0ac3f;}
  .error{color:#e08a7a;font-size:0.85rem;margin-bottom:10px;text-align:center;}
</style>
</head>
<body>
  <div class="box">
    <h1>🤠 Cowboy's Admin</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <input type="password" name="password" placeholder="Şifre" autofocus>
      <button type="submit">Giriş Yap</button>
    </form>
  </div>
</body>
</html>
